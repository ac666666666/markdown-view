<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="轻量级MD预览器 - 支持实时预览、文件上传、主题切换" />
    <meta name="keywords" content="Markdown, 预览器, React, 在线编辑" />
    
    <!-- 移动端通用优化 -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />
    
    <!-- 微信浏览器优化 -->
    <meta name="x5-orientation" content="portrait" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    
    <!-- QQ浏览器优化 -->
    <meta name="browsermode" content="application" />
    <meta name="x5-page-mode" content="app" />
    
    <!-- UC浏览器优化 -->
    <meta name="screen-orientation" content="portrait" />
    <meta name="full-screen" content="yes" />
    <meta name="layoutmode" content="fitscreen" />
    
    <!-- iOS Safari 优化 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MD预览器" />
    
    <!-- Android Chrome 优化 -->
    <meta name="theme-color" content="#1f2937" />
    <meta name="msapplication-navbutton-color" content="#1f2937" />
    
    <title>MD预览器</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
